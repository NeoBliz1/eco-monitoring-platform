syntax = "proto3";

package weather.map;
option java_multiple_files = true;
option java_package = "me.neobliz1.ecomonitoring.platform.shared.contracts.proto.map";

message WeatherMap {
  int64 timestamp_bucket = 1;
  int32 interval_minutes = 2;
  map<string, GridCellLayers> grid_cells = 3;
}

message GridCellLayers {
  string geohash = 1;
  int32 reading_count = 2;

  double avg_temperature = 3;
  double avg_humidity = 4;
  double avg_pressure = 5;

  double avg_wind_speed = 6;
  double avg_wind_direction = 7;

  double avg_pm25 = 8;
  double avg_pm10 = 9;
  double avg_pm100 = 10;

  double avg_voc = 11;
  double avg_noise_db = 12;

  double avg_rain_mm = 13;
  double avg_snow_cm = 14;
  double avg_evap_rate = 15;

  double avg_uv_index = 16;
  double avg_solar_radiation_wm2 = 17;
  double avg_lux = 18;
  double avg_visibility_m = 19;
}