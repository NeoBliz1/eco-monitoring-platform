spring:
  profiles:
    include:
      # profile for include common configs from common-core module
      - common
      - common-web
  application:
    name: ${SPRING_HISTORY_APPLICATION_NAME}
  grpc:
    server:
      port: ${HISTORY_APPLICATION_GRPC_PORT}
  config:
    import: "optional:consul:${SPRING_CLOUD_CONSUL_HOST}:${SPRING_CLOUD_CONSUL_PORT}/"
  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST}
      port: ${SPRING_CLOUD_CONSUL_PORT}
      discovery:
        enabled: true
        prefer-ip-address: true
        ip-address: ${SERVER_HOST}
        port: ${HISTORY_APPLICATION_SERVER_PORT}
        service-name: ${SPRING_HISTORY_APPLICATION_NAME}
        health-check-path: /actuator/health
        health-check-interval: 10s
        metadata:
          gRPC_port: ${HISTORY_APPLICATION_GRPC_PORT}
      config:
        enabled: true
        format: yaml
        prefixes: config
        import-check:
          enabled: false
  threads:
    virtual:
      enabled: true
  datasource:
    service-name: ${SPRING_DATA_SERVICE_NAME}
    username: ${postgres_user:${SPRING_DATA_POSTGRES_USER_NAME}}
    password: ${postgres_password:${SPRING_DATA_POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    database: ${SPRING_DATA_DB_NAME}
    schema-name: ${POSTGRES_DB_SCHEMA}
  data:
    redis:
      service-name: ${SPRING_DATA_REDIS_SERVICE_NAME}
      password: ${redis_password:${SPRING_DATA_REDIS_PASSWORD}}
  kafka:
    service-name: ${KAFKA_SERVICE_NAME}
    properties:
      group.protocol: "consumer"
      security.protocol: "SASL_PLAINTEXT"
      sasl.mechanism: "SCRAM-SHA-512"
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${kafka_client:${KAFKA_CLIENT}}\" password=\"${kafka_client_password:${KAFKA_CLIENT_PASSWORD}}\";"
    consumer:
      group-id: "eco-history-consumer-group"
      auto-offset-reset: "earliest"
      isolation-level: "read_committed"
      enable-auto-commit: false
      key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      value-deserializer: "org.springframework.kafka.support.serializer.ErrorHandlingDeserializer"
      properties:
        spring.deserializer.value.delegate.class: "io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer"
        specific.protobuf.value.type: "me.neobliz1.ecomonitoring.platform.shared.contracts.proto.map.WeatherMap"
    producer:
      acks: all
      retries: 2147483647
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      value-serializer: "io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        generate_statistics: true
        jdbc:
          batch_size: 50
        cache:
          use_second_level_cache: true
          use_query_cache: true
          jakarta:
            cache:
              redisson:
                fallback: false
                singleServerConfig:
                  connectionPoolSize: 64
                  connectionMinimumIdleSize: 24
                config: >
                  {
                    "weather_map_buckets": {"ttl": 1800000},
                    "weather_map_buckets.gridCells": {"ttl": 1800000},
                    "weather_grid_cell_metrics": {"ttl": 1800000},
                    "default-query-results-region": {"ttl": 300000},
                    "default-update-timestamps-region": {"ttl": 0}
                  }

server:
  port: ${HISTORY_APPLICATION_SERVER_PORT}

springdoc:
  openapi:
    info:
      title: "EcoMonitoring History Service"
      version: "1.0.0"
      description: "Historical telemetry data storage and queries."
      license:
        name: "Apache 2.0"
        url: "https://springdoc.org"

---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    vault:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - "optional:consul:${SPRING_CLOUD_CONSUL_HOST}:${SPRING_CLOUD_CONSUL_PORT}/"
      - vault://secret/history-service
  cloud:
    vault:
      enabled: true
      uri: http://${SPRING_CLOUD_VAULT_HOST}:${SPRING_CLOUD_VAULT_PORT}
      kv:
        enabled: true
        backend: secret
        default-context: history-service
      authentication: APPROLE
      app-role:
        role-id: ${HISTORY_VAULT_ROLE_ID}
        secret-id: ${HISTORY_VAULT_SECRET_ID}