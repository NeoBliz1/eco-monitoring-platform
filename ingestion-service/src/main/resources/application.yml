spring:
    application:
        name: ${SPRING_INGESTION_APPLICATION_NAME}
    cloud:
        consul:
            host: ${SPRING_CLOUD_CONSUL_HOST}
            port: ${SPRING_CLOUD_CONSUL_PORT}
            discovery:
                enabled: true
                prefer-ip-address: true
                ip-address: ${SERVER_HOST}
                port: ${INGESTION_APPLICATION_SERVER_PORT}
                service-name: ${SPRING_INGESTION_APPLICATION_NAME}
                health-check-path: /actuator/health
                health-check-interval: 10s

server:
    port: ${INGESTION_APPLICATION_SERVER_PORT}

management:
    health:
        defaults:
            enabled: true
    endpoint:
        health:
            show-details: "always"
            show-components: "always"
            probes:
                enabled: true
    endpoints:
        web:
            exposure:
                include: "health,info,prometheus"
