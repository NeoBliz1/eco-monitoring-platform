include:
  - ./compose/kafka/kafka.yaml
  - ./compose/kafka/kafka-init-topics.yaml
  - ./compose/schema-registry/schema-registry.yaml
  - ./compose/consul/consul.yaml
  - ./compose/jaeger.yaml
  - ./compose/redis/redis.yaml
  - ./compose/postgres/postgres.yaml
  - ./compose/vector/vector-sidecar.yaml
  - ./compose/vault/vault.yaml
  - ./compose/prometheus/prometheus-server.yaml
  - ./compose/clickhouse/clickhouse.yaml
  - ./compose/grafana/grafana.yaml

volumes:
  postgres_persistence_file: { }
  redis_persistence_file: { }
  prometheus_storage: { }
  vector_disk_buffer:
    driver: local
  kafka_data_1: { }
  kafka_data_2: { }
  kafka_data_3: { }
  vault_storage: { }
  vault_tokens: { }
  ram_secrets_kafka_1:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_kafka_2:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_kafka_3:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_registry:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_postgres:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=999,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_redis:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=999,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_clickhouse:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0777,noswap,noexec,nosuid,nodev"
  ram_secrets_grafana:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=472,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_prometheus:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0777,noswap,noexec,nosuid,nodev"
  ram_secrets_vector:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0777,uid=1000,gid=1000,noswap,noexec,nosuid,nodev"


networks:
  eco-net:
    driver: bridge