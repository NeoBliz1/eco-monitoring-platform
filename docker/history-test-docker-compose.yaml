include:
  - compose/consul/consul.yaml
  - ./compose/vault/vault.yaml
  - ./compose/kafka/kafka.yaml
  - ./compose/history-test/postgres.yaml
  - ./compose/kafka/kafka-init-topics.yaml
  - ./compose/schema-registry/schema-registry.yaml

volumes:
  kafka_data_1: { }
  kafka_data_2: { }
  kafka_data_3: { }
  vault_storage: { }
  vault_tokens: { }
  ram_secrets_kafka_1:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_kafka_2:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_kafka_3:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_registry:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=100,gid=1000,noswap,noexec,nosuid,nodev"
  ram_secrets_postgres:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0770,uid=999,gid=1000,noswap,noexec,nosuid,nodev"
  ram_postgres_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,mode=0700,uid=999,gid=999,noswap,noexec,nosuid,nodev"


networks:
  eco-net:
    driver: bridge