databaseChangeLog:
  - changeSet:
      id: 001-initialize-weather-map-storage-idempotent-final
      author: neobliz1
      comment: Defensive schema initialization handling existing structures and missing columns without crashing
      changes:

        # =========================================================================
        # 1. MASTER TABLE INITIALIZATION (weather_map_buckets)
        # =========================================================================
        - sql:
            dbms: postgresql
            splitStatements: true
            endDelimiter: ;
            sql: |
              -- Create master table base if it does not exist at all
              CREATE TABLE IF NOT EXISTS weather_map_buckets (
                id UUID NOT NULL,
                CONSTRAINT pk_weather_map_buckets PRIMARY KEY (id)
              );

              -- Append missing attributes safely without breaking existing fields
              ALTER TABLE weather_map_buckets ADD COLUMN IF NOT EXISTS timestamp_bucket BIGINT;
              ALTER TABLE weather_map_buckets ADD COLUMN IF NOT EXISTS interval_minutes INT;
              ALTER TABLE weather_map_buckets ADD COLUMN IF NOT EXISTS version BIGINT DEFAULT 0;

              -- Enforce required data integrity constraints on the master columns
              ALTER TABLE weather_map_buckets ALTER COLUMN timestamp_bucket SET NOT NULL;
              ALTER TABLE weather_map_buckets ALTER COLUMN interval_minutes SET NOT NULL;
              ALTER TABLE weather_map_buckets ALTER COLUMN version SET NOT NULL;

              -- Drop and cleanly rebuild structural table constraints to prevent duplicate errors
              ALTER TABLE weather_map_buckets DROP CONSTRAINT IF EXISTS uq_bucket_time_window;
              ALTER TABLE weather_map_buckets ADD CONSTRAINT uq_bucket_time_window UNIQUE (timestamp_bucket, interval_minutes);

              ALTER TABLE weather_map_buckets DROP CONSTRAINT IF EXISTS chk_bucket_timestamp_positive;
              ALTER TABLE weather_map_buckets ADD CONSTRAINT chk_bucket_timestamp_positive CHECK (timestamp_bucket > 0);

              -- Recreate performance index for fast descending time sorting
              DROP INDEX IF EXISTS idx_bucket_time_desc;
              CREATE INDEX idx_bucket_time_desc ON weather_map_buckets (timestamp_bucket DESC);

        # =========================================================================
        # 2. CHILD TABLE CORE STRUCTURAL INITIALIZATION (weather_grid_cell_metrics)
        # =========================================================================
        - sql:
            dbms: postgresql
            splitStatements: true
            endDelimiter: ;
            sql: |
              -- Create child metrics table structure with its composite primary key if missing
              CREATE TABLE IF NOT EXISTS weather_grid_cell_metrics (
                bucket_id UUID NOT NULL,
                geohash VARCHAR NOT NULL,
                CONSTRAINT pk_grid_cell_metrics_compound PRIMARY KEY (bucket_id, geohash)
              );

              -- Re-verify and map the cascading foreign key constraint
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS fk_metrics_to_bucket;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT fk_metrics_to_bucket 
                FOREIGN KEY (bucket_id) REFERENCES weather_map_buckets(id) ON DELETE CASCADE;

        # =========================================================================
        # 3. METRICS COLUMNS INJECTION
        # =========================================================================
        - sql:
            dbms: postgresql
            splitStatements: true
            endDelimiter: ;
            sql: |
              -- Add core track count column
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS reading_count INT;
              ALTER TABLE weather_grid_cell_metrics ALTER COLUMN reading_count SET NOT NULL;

              -- Add all sparse numeric metric fields safely
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_temperature DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_humidity DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_pressure DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_leaf_wetness_pct DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_wind_speed DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_wind_direction DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_pm25 DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_pm10 DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_pm100 DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_voc DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_noise_db DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_rain_mm DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_snow_cm DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_evap_rate DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_uv_index DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_solar_radiation_wm2 DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_lux DOUBLE PRECISION;
              ALTER TABLE weather_grid_cell_metrics ADD COLUMN IF NOT EXISTS avg_visibility_m DOUBLE PRECISION;

        # =========================================================================
        # 4. DATA BOUNDS AND COMPLEX CHECK CONSTRAINTS
        # =========================================================================
        - sql:
            dbms: postgresql
            splitStatements: true
            endDelimiter: ;
            sql: |
              -- Overwrite or establish metric valid threshold parameters safely
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS chk_reading_count_positive;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT chk_reading_count_positive CHECK (reading_count >= 1);
              
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS chk_ambient_sparse_bounds;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT chk_ambient_sparse_bounds CHECK (
                (avg_temperature IS NULL OR avg_temperature BETWEEN -100.0 AND 100.0)
                AND (avg_humidity IS NULL OR avg_humidity BETWEEN 0.0 AND 100.0)
                AND (avg_pressure IS NULL OR avg_pressure BETWEEN 0.0 AND 1500.0)
                AND (avg_leaf_wetness_pct IS NULL OR avg_leaf_wetness_pct BETWEEN 0.0 AND 100.0)
              );
              
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS chk_wind_sparse_bounds;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT chk_wind_sparse_bounds CHECK (
                (avg_wind_speed IS NULL OR avg_wind_speed >= 0.0)
                AND (avg_wind_direction IS NULL OR avg_wind_direction BETWEEN 0.0 AND 360.0)
              );
              
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS chk_air_quality_sparse_bounds;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT chk_air_quality_sparse_bounds CHECK (
                (avg_pm25 IS NULL OR avg_pm25 >= 0.0) AND (avg_pm10 IS NULL OR avg_pm10 >= 0.0) 
                AND (avg_pm100 IS NULL OR avg_pm100 >= 0.0) AND (avg_voc IS NULL OR avg_voc >= 0.0) 
                AND (avg_noise_db IS NULL OR avg_noise_db >= 0.0)
              );
              
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS chk_precipitation_sparse_bounds;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT chk_precipitation_sparse_bounds CHECK (
                (avg_rain_mm IS NULL OR avg_rain_mm >= 0.0) AND (avg_snow_cm IS NULL OR avg_snow_cm >= 0.0) 
                AND (avg_evap_rate IS NULL OR avg_evap_rate >= 0.0)
              );
              
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS chk_optical_sparse_bounds;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT chk_optical_sparse_bounds CHECK (
                (avg_uv_index IS NULL OR avg_uv_index >= 0.0) AND (avg_solar_radiation_wm2 IS NULL OR avg_solar_radiation_wm2 >= 0.0) 
                AND (avg_lux IS NULL OR avg_lux >= 0.0) AND (avg_visibility_m IS NULL OR avg_visibility_m >= 0.0)
              );
              
              ALTER TABLE weather_grid_cell_metrics DROP CONSTRAINT IF EXISTS chk_at_least_one_metric_group_present;
              ALTER TABLE weather_grid_cell_metrics ADD CONSTRAINT chk_at_least_one_metric_group_present CHECK (
                avg_temperature IS NOT NULL 
                OR avg_wind_speed IS NOT NULL 
                OR avg_pm25 IS NOT NULL 
                OR avg_rain_mm IS NOT NULL 
                OR avg_uv_index IS NOT NULL
              );

              DROP INDEX IF EXISTS idx_metrics_geohash_standalone;
              CREATE INDEX idx_metrics_geohash_standalone ON weather_grid_cell_metrics (geohash);

      rollback:
        - dropTable: { tableName: weather_grid_cell_metrics }
        - dropTable: { tableName: weather_map_buckets }
