databaseChangeLog:
  - changeSet:
      id: 002-add-weather-telemetry-station-transaction-ids
      author: neobliz1
      comment: Flat transactional mapping table optimized with a surrogate key
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            endDelimiter: ;
            sql: |
              CREATE TABLE IF NOT EXISTS weather_telemetry_station_transaction_ids (
                id UUID NOT NULL,
                tx_id_ingestion VARCHAR(50),
                tx_id_history VARCHAR(50),
                CONSTRAINT pk_weather_telemetry_station_tx PRIMARY KEY (id),
                CONSTRAINT uq_tx_id_ingestion_flat UNIQUE (tx_id_ingestion),
                CONSTRAINT uq_tx_id_history_flat UNIQUE (tx_id_history)
              );

              DROP INDEX IF EXISTS idx_weather_tx_ingestion;
              CREATE INDEX idx_weather_tx_ingestion ON weather_telemetry_station_transaction_ids (tx_id_ingestion);

              DROP INDEX IF EXISTS idx_weather_tx_history;
              CREATE INDEX idx_weather_tx_history ON weather_telemetry_station_transaction_ids (tx_id_history);
  - changeSet:
      id: 003-add-weather-telemetry-dlt-archive
      author: neobliz1
      comment: Storage archive for corrupt or unprocessable dead letter payloads
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            endDelimiter: ;
            sql: |
              CREATE TABLE IF NOT EXISTS weather_telemetry_dlt_records (
                id UUID NOT NULL,
                original_topic VARCHAR(255) NOT NULL,
                partition_id INT NOT NULL,
                original_offset BIGINT NOT NULL,
                exception_message TEXT,
                exception_stacktrace TEXT,
                raw_payload_bytes BYTEA,
                exiled_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT pk_weather_telemetry_dlt PRIMARY KEY (id)
              );

              DROP INDEX IF EXISTS idx_weather_dlt_lookup;
              CREATE INDEX idx_weather_dlt_lookup ON weather_telemetry_dlt_records (original_topic, partition_id);

              DROP INDEX IF EXISTS idx_weather_dlt_timestamp;
              CREATE INDEX idx_weather_dlt_timestamp ON weather_telemetry_dlt_records (exiled_at);