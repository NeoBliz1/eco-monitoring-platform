services:
  pg-db-test:
    image: postgres:18.4-alpine3.24
    ports:
      - "5432:5432"
    networks:
      - eco-net
    environment:
      POSTGRES_DB: ecomonitoring_test
      POSTGRES_USER: eco_user
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eco_user -d ecomonitoring_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"
