services:
  vault-init-base:
    image: hashicorp/vault:2.0.0
    user: "100:1000"
    depends_on:
      vault-server:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - eco-net
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        cp /etc/vault/agent.hcl /tmp/runtime_agent.hcl
        sed -i "s|__ROLE_ID_PATH__|$${KAFKA_ROLE_ID_FILE}|g" /tmp/runtime_agent.hcl
        sed -i "s|__SECRET_ID_PATH__|$${KAFKA_SECRET_ID_FILE}|g" /tmp/runtime_agent.hcl
        exec vault agent -exit-after-auth -config=/tmp/runtime_agent.hcl

  kafka-base:
    image: confluentinc/cp-kafka:8.2.0
    networks:
      - eco-net
    user: "1000:1000"
    depends_on:
      vault-server:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 --version || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:SASL_PLAINTEXT,CLIENT:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_SASL_ENABLED_MECHANISMS: "SCRAM-SHA-512"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "SCRAM-SHA-512"
      EXTRA_ARGS: "-Djava.security.auth.login.config=/run/secrets/kafka_server_jaas"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 50
      KAFKA_TRANSACTION_STATE_LOG_RECOVERY_THREADS: 1
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      KAFKA_CONFLUENT_TYPE_VALIDATORS: "protobuf"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - ./kafka-init.sh:/usr/local/bin/init-kafka.sh:ro
    entrypoint: [ "sh", "-c" ]
    command: [ "/usr/local/bin/init-kafka.sh" ]
