      LISTENERS_CONFIG: "INTERNAL://:9093,CLIENT://:9092,EXTERNAL://:9194,CONTROLLER://:19093"
      ADVERTISED_LISTENERS_CONFIG: "INTERNAL://kafka-2:9093,CLIENT://kafka-2:9092,EXTERNAL://localhost:9194"
      KAFKA_LISTENERS: 'INTERNAL://:9093,CLIENT://:9092,EXTERNAL://:9194,CONTROLLER://:19093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-2:9093,CLIENT://kafka-2:9092,EXTERNAL://localhost:9194'

