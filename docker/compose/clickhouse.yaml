services:
  clickhouse-db:
    image: clickhouse:26.7
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./../../.data/clickhouse/data:/var/lib/clickhouse
      - ./../../.data/clickhouse/logs:/var/log/clickhouse-server
    networks:
      - eco-net
    restart: on-failure
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 3s
      timeout: 3s
      retries: 5

  clickhouse-db-init:
    image: clickhouse:26.7
    depends_on:
      clickhouse-db:
        condition: service_healthy
    networks:
      - eco-net
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        echo "📡 Bootstrapping ClickHouse administrative access..."
        
        # 1. Connect via the default administrator account to provision the custom user and roles
        clickhouse-client --host clickhouse-db \
          --user "default" \
          --multiquery <<EOF
        
          CREATE USER IF NOT EXISTS "${CLICKHOUSE_USER}" IDENTIFIED WITH sha256_password BY '${CLICKHOUSE_PASSWORD}';
          GRANT ALL ON *.* TO "${CLICKHOUSE_USER}" WITH GRANT OPTION;
          ALTER USER default IDENTIFIED WITH sha256_password BY '${CLICKHOUSE_DEFAULT_PASSWORD}';
          REVOKE ALL ON *.* FROM default;
        EOF
        
        echo "🔒 Default admin account locked via environment profile credentials. Initializing logging schema..."
        
        # 2. Connect using freshly provisioned custom user credentials to build the schema tables
        clickhouse-client --host clickhouse-db \
          --user "${CLICKHOUSE_USER}" \
          --password "${CLICKHOUSE_PASSWORD}" \
          --multiquery <<EOF
        
          CREATE DATABASE IF NOT EXISTS ${CLICKHOUSE_DB};
        
          USE ${CLICKHOUSE_DB};
        
          CREATE TABLE IF NOT EXISTS application_logs (
              timestamp DateTime64(3, 'Europe/Moscow'),
              service_name LowCardinality(String),
              level LowCardinality(String),
              thread_name String,
              logger_name String,
              message String,
              trace_id String,
              span_id String,
              stack_trace String
          ) ENGINE = MergeTree()
          ORDER BY (service_name, level, timestamp)
          PARTITION BY toYYYYMM(timestamp)
          TTL timestamp + INTERVAL 7 DAY DELETE;
        EOF
        
        echo "✅ ClickHouse telemetry log database initialization finished successfully!"

