global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'vector-sidecar-telemetry'
    static_configs:
      - targets: [ 'vector-sidecar:9598' ]

  - job_name: 'go-api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'host.docker.internal:8000' ]

  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # Ingestion service
          - 'host.docker.internal:8081' # Analysis service
          - 'host.docker.internal:8082' # History service

  - job_name: 'postgres-database-metrics'
    scrape_interval: 2s
    metrics_path: '/metrics'
    basic_auth:
      username_file: '/run/secrets/prom_exporter_username'
      password_file: '/run/secrets/prom_exporter_password'
    static_configs:
      - targets: [ 'postgres-exporter:9187' ]

