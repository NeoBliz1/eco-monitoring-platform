spring:
  profiles:
    # profile for include common configs from common-core module
    include: common
  application:
    name: ${SPRING_ANALYSIS_APPLICATION_NAME}
  config:
    import: "optional:consul:${SPRING_CLOUD_CONSUL_HOST}:${SPRING_CLOUD_CONSUL_PORT}/"
  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST}
      port: ${SPRING_CLOUD_CONSUL_PORT}
      discovery:
        enabled: true
        prefer-ip-address: true
        ip-address: ${SERVER_HOST}
        port: ${ANALYSIS_APPLICATION_SERVER_PORT}
        service-name: ${SPRING_ANALYSIS_APPLICATION_NAME}
        health-check-path: /actuator/health
        health-check-interval: 10s
      config:
        enabled: true
        format: yaml
        prefixes: config
  data:
    redis:
      service-name: ${SPRING_DATA_REDIS_SERVICE_NAME}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  kafka:
    service-name: ${KAFKA_SERVICE_NAME}
    streams:
      application-id: "eco-analysis-streams-pipeline"
      properties:
        processing.guarantee: "exactly_once_v2"
        commit.interval.ms: 100
        topology.optimization: "all"
        security.protocol: "SASL_PLAINTEXT"
        sasl.mechanism: "SCRAM-SHA-512"
        sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_CLIENT}\" password=\"${KAFKA_CLIENT_PASSWORD}\";"

server:
  port: ${ANALYSIS_APPLICATION_SERVER_PORT}

management:
  metrics:
    enable:
      lettuce: true