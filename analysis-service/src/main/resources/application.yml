spring:
  profiles:
    include: common
  application:
    name: ${SPRING_ANALYSIS_APPLICATION_NAME}
  config:
    import: "optional:consul:${SPRING_CLOUD_CONSUL_HOST}:${SPRING_CLOUD_CONSUL_PORT}/"
  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST}
      port: ${SPRING_CLOUD_CONSUL_PORT}
      discovery:
        enabled: true
        prefer-ip-address: true
        ip-address: ${SERVER_HOST}
        port: ${ANALYSIS_APPLICATION_SERVER_PORT}
        service-name: ${SPRING_ANALYSIS_APPLICATION_NAME}
        health-check-path: /actuator/health
        health-check-interval: 10s
      config:
        enabled: true
        format: yaml
        prefixes: config
  data:
    redis:
      service-name: ${SPRING_DATA_REDIS_SERVICE_NAME}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  kafka:
    service-name: ${KAFKA_SERVICE_NAME}
    streams:
      application-id: "eco-analysis-streams-pipeline"
      properties:
        processing.guarantee: "exactly_once_v2"
        isolation.level: "read_committed"
        commit.interval.ms: 100
        topology.optimization: "all"
        default.key.serde: "org.apache.kafka.common.serialization.Serdes$StringSerde"
        default.value.serde: "org.apache.kafka.common.serialization.Serdes$ByteArraySerde"
        security.protocol: "SASL_PLAINTEXT"
        sasl.mechanism: "SCRAM-SHA-512"
        sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_CLIENT}\" password=\"${KAFKA_CLIENT_PASSWORD}\";"
    consumer:
      group-id: "eco-analysis-consumer-group"
      auto-offset-reset: "earliest"
      isolation-level: "read_committed"
      enable-auto-commit: false
      key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      value-deserializer: "org.springframework.kafka.support.serializer.ErrorHandlingDeserializer"
    listener:
      ack-mode: "manual_immediate"
    properties:
      security.protocol: "SASL_PLAINTEXT"
      sasl.mechanism: "SCRAM-SHA-512"
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_CLIENT}\" password=\"${KAFKA_CLIENT_PASSWORD}\";"
      spring.deserializer.value.delegate.class: "me.neobliz1.ecomonitoring.platform.common.serialization.WeatherPacketDeserializer"

server:
  port: ${ANALYSIS_APPLICATION_SERVER_PORT}

management:
  health:
    defaults:
      enabled: true
  endpoint:
    health:
      show-details: "always"
      show-components: "always"
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"